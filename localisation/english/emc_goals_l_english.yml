l_english:
 CAS_the_setrus_administration:0 "The Setrus Administration"
 CAS_the_setrus_administration_desc:0 "Setrus has won the Cascadian presidency, with promises of improving the national shop, finishing Project Fresno, and ensuring the national defense against Wagner invaders."
 CAS_project_fresno_1:0 "Complete Project Fresno"
 CAS_project_fresno_1_desc:0 "Fresno was once one of the largest and most prosperous cities in California, but in recent months has fallen into disrepair. Now under our control, we should expand Fresno to be able to support new residents and become active again."
 CAS_national_city_olympia:0 "The National City of Olympia Act"
 CAS_national_city_olympia_desc:0 "Now split into a collection of 6 towns, Olympia and its immediate neighbors wish to form a united municipal government with authority over the capital city."
 CAS_vancouver_emergency_funding_1:0 "Vancouver Emergency Funding Act"
 CAS_vancouver_emergency_funding_1_desc:0 "Wagner forces are attempting to take territory in the area planned for the development of Vancouver. They must not be allowed to advance any further!"
 CAS_national_sports_act:0 "National Sports Act"
 CAS_national_sports_act_desc:0 "With Cascadians often discriminated against in mainstream EMC sports, Cascadia should seek to create its own sports league, the EMCHL, and declare hockey to be the national sport."
 CAS_project_vancouver_1:0 "Project Vancouver"
 CAS_project_vancouver_1_desc:0 "Vancouver, despite its status as a major west coast city, has long been undeveloped. President Setrus has made it his personal goal to change this, and make Vancouver into a city to rival Seattle."
 CAS_icerail_preservation_act:0 "The Icerail Preservation Act"
 CAS_icerail_preservation_act_desc:0 "Our system of icerails is in disarray, despite being an essential connection between the diverse regions of Cascadia. However, before we can fix the system, we first need to establish the foundation that the government has the sole right to maintain and operate the icerails."
 CAS_na_pact_uf:0 "Pact with the UF"
 CAS_na_pact_uf_desc:0 "Although we are no longer a member of the United Front, it would be useful to maintain a non-aggression pact as a small show of support towards the communist bloc."
 CAS_patagonia_na_pact:0 "Friendship with Patagonia"
 CAS_patagonia_na_pact_desc:0 "The Kingdom of Patagonia has contacted us requesting a non-aggression pact. We can use all the friends we can get nowadays."
 CAS_cooperate_with_local_officials:0 "Cooperate with Local Officials"
 CAS_cooperate_with_local_officials_desc:0 "Fighting with local officials in the Great North over who has right to the icerails simply is not worth our time and energy. We shall find a way to mend this crisis."
 CAS_federate_the_icerails:0 "Federate the Icerails"
 CAS_federate_the_icerails_desc:0 "Rather than debate who truly has authority over the icerails, the government will recognize that towns have the sole right to maintain their respective icerail connections, and encourage neighboring towns to work together towards this goal."
 CAS_fight_local_officials:0 "Fight Local Officials"
 CAS_fight_local_officials_desc:0 "The Icerails will be built, whether the Great North mayors want it or not."
 CAS_kick_orbit:0 "Kick Orbit"
 CAS_kick_orbit_desc:0 "Its clear at this point that the source of the issue in the Great North is political agitation from the likes of Orbit and Hershey. Lets prioritize the stability of the nation and focus on dealing with them rather than continuing to fight over icerails."
 CAS_cascgate_reborn:0 "CascGate Reborn"
 CAS_cascgate_reborn_desc:0 "The time has come to implement the full scale of CascGate, and build the icerails no matter the cost. However, officials in the Department of Defense have advised that this move could risk some towns seceding to the Reformed Republic of Cascadia."
 CAS_havaiki_alliance:0 "Alliance with Havaiki"
 CAS_havaiki_alliance_desc:0 "The nation of Haviki has recently been established in New Zealand, promising a new and ingenuitve democracy in the south seas. They would make excellent allies in the Pacific."
 CAS_ofn_expansion:0 "OFN Expansion"
 CAS_ofn_expansion_desc:0 "Havaiki and Vermont provide oppurtunities to expand the OFN and revive the alliance of free nations."

 TEX_continue_the_path:0 "Continue the Path"
 TEX_continue_the_path_desc:0 "For Texas to achieve greatness, we must continue the path of the Consul NorthPaso."
 TEX_nationalist_sentiments:0 "Nationalist Sentiments"
 TEX_nationalist_sentiments_desc:0 "If we are reach the heights of the old Rio Grande Empire, we must embrace nationalism."
 TEX_reform_senate:0 "Reform the Senate"
 TEX_reform_senate_desc:0 "The Texan government has been inactive for some time. By reforming the senate and reviving an elected president subservient to the king, we may greatly improve our leadership and citizen involvement."
 TEX_crusade_against_communism:0 "Crusade on Communism"
 TEX_crusade_against_communism_desc:0 "Communism is a scurge upon the Christian world and must be extinguished at all costs."
 TEX_development_plan:0 "Development Plan"
 TEX_development_plan_desc:0 "A successful economic plan will be required to support the nation's economy and our plans for expansion."
 TEX_develop_houston:0 "Develop Houston"
 TEX_develop_houston_desc:0 "The development of the capital and the surronding towns on the Gulf Coast are of key importance to the future of Texas."
 TEX_dallas_investments:0 "Dallas Investments"
 TEX_dallas_investments_desc:0 "Dallas and Fort Worth are amongst the developing towns in northern Texas. Supporting their development will further our economic goals."
 TEX_i_want_gold:0 "I Want Gold Casino"
 TEX_i_want_gold_desc:0 "The I Want Gold casino is offering to provide us with a reliable supply of gold to further fund our expansion!"
 TEX_secure_rio_grande:0 "Secure the Rio Grande"
 TEX_secure_rio_grande_desc:0 "With the old Mexican Empire in decline, the oppurtunity to expand our influence south of the Rio Grande has never been greater."
 TEX_annex_yucatan:0 "Annex the Yucatan"
 TEX_annex_yucatan_desc:0 "The Yucatan is a region where the declining Mexican Empire has very little control. We could easily annex the region and, in doing so, gain a foothold at the gates of the Caribbean."
 TEX_icerail_construction_i:0 "Icerail Construction"
 TEX_icerail_construction_i_desc:0 "One of the most effective ways for us to connect towns across our nation would be to invest in icerails and road connections."
 TEX_develop_the_core:0 "Develop the Core"
 TEX_develop_the_core_desc:0 "The King believes that the most efficient use of our resources would be to focus development in the capital city and the surronding towns, rather than wasting resources on the sparsely populated frontier."
 TEX_military_development_plan:0 "Military Development Plan"
 TEX_military_development_plan_desc:0 "The further expansion of our empire will require extreme growth in our military industrial base."
 TEX_rio_grande_expeditions:0 "Rio Grande Expeditions"
 TEX_rio_grande_expeditions_desc:0 "The annexed regions of northern Mexico provide us with excellent oppurtunities for extracting new resources essential to our economy."
 TEX_invest_in_yucatan:0 "Invest in Yucatan"
 TEX_invest_in_yucatan_desc:0 "The forests of the Yucatan peninsula provide remarkable oppurtunity for the Texan economy and cementing our control over the region."
 TEX_red_river_projects:0 "Red River Projects"
 TEX_red_river_projects_desc:0 "The plains of Oklahoma are open to development and can be easily used to construct new military factories. With investment in Oklahoma, it will also be cemented as part of our core territory."
 TEX_the_mexican_gambit:0 "The Mexican Gambit"
 TEX_the_mexican_gambit_desc:0 "We have recieved an offer from former Texan CMW to create a series of new towns within Mexico with the goal of eventually leading much of the remaining Mexican towns into the hands of Texas. This may be an oppurunity to good to give up."
 TEX_affirm_american_claims:0 "Affirm American Claims"
 TEX_affirm_american_claims_desc:0 "For too long, our territorial claims in the continental U.S. have been ignored. If we are to revive the glory of the Rio Grande Empire, then we must at last affirm our right to the lands of America."
 TEX_strike_california:0 "Strike California"
 TEX_strike_california_desc:0 "For too long, the Cascadian menace has been allowed to continue. But now, at last, an oppurtunity has presented itself. Ewhy has purchased the small nation of California, and offered to join us and give us a chance to conquer not just California but all of Cascadia. Finally, we shall destroy Cascadia!"
 TEX_eastern_blitz:0 "Eastern Blitz"
 TEX_eastern_blitz_desc:0 "Vermont is not yet ready for war. The fastest way to defeat them will be a swift offensive through the heart of the American South."
 TEX_operation_tropical_hideaway:0 "Operation Tropical Hideaway"
 TEX_operation_tropical_hideaway_desc:0 "The Caribbean islands of Cuba are home to resources required by our war effort. At the same time, conquest of these tropical islands would further cement our role in the Caribbean."
 TEX_finish_off_mexico:0 "Finish off Mexico"
 TEX_finish_off_mexico_desc:0 "Despite years of decline and territorial incursions, Mexico still stands. This fact has lasted long enough. The time has finally come to finish them off once and for all."
 TEX_war_panama:0 "Gateway to South America"
 TEX_war_panama_desc:0 "The small nation of Panama serves as the gateway to the South American continent. By expanding our conquests southward, an entire continent of possibilities becomes available."
 TEX_befriend_panama:0 "Befriend Panama"
 TEX_befriend_panama_desc:0 "Panama, led by Dres1, is a growing power in Central America. Becoming friendly with them could serve our interests well and improve our power projection in the region."
 TEX_masters_of_the_prarie:0 "Masters of the Prarie"
 TEX_masters_of_the_prarie_desc:0 "The Great Plains are a vast and underdeveloped region which have fallen under our control. There is fantastic oppurtunity for new farms and the manufacturing of much-needed resources in this region."
 TEX_jewel_of_america:0 "Jewel of America"
 TEX_jewel_of_america_desc:0 "Houston's growth has been unlike any other city in the Americas. With more projects, it may become the crown jewel of America!"
 TEX_gulf_coast_naval_yards:0 "Gulf Coast Naval Yards"
 TEX_gulf_coast_naval_yards_desc:0 "The Gulf Coast provides an excellent oppurtunity for the expansion of dockyards to grow our fleet."

 BRZ_choosing_a_successor:0 "Choosing a Successor"
 BRZ_choosing_a_successor_desc:0 "With Olivio absent, the remaining Brazilian leadership must choose which path the nation will take going forward."
 BRZ_olivios_return:0 "Olivio's Return"
 BRZ_olivios_return_desc:0 "Thanks to the lobbying of the old Crown Council, Olivio has agreed to return to Brazil and lead the nation once again."
 BRZ_olivios_will_return:0 "Olivio will return from absence"
 BRZ_reform_the_senate:0 "Reform the Senate"
 BRZ_reform_the_senate_desc:0 "A critical component of reviving Brazil's activity will be reforming the nation's elected body, the senate."
 BRZ_finish_off_americans:0 "Finish off the Americans"
 BRZ_finish_off_americans_desc:0 "The pesky Americans to our south have been our rivals since the days of Codah. Now is the time to remove them once and for all. WARNING, you will only have 900 days to complete this war before a peace is negotiatied. Better victories during the war will have better results, and vice-versa."
 BRZ_brazil_across_three_oceans:0 "Brazil Across Three Oceans"
 BRZ_brazil_across_three_oceans_desc:0 "With the American problem addressed, our armed forces have the oppurtunity to cement our authority over the loosley-claimed regions of Ecuador, Colombia, and Venezuela."
 BRZ_conference_of_the_americas:0 "Conference of the Americas"
 BRZ_conference_of_the_americas_desc:0 "Cascadia is attempting to form an alliance of democratic nations to defend the Americas from overseas colonialism. If we choose to join, this alliance could define national defense across the Western Hemisphere."
 BRZ_reaffirm_continental_neutrality:0 "Reaffirm our Continental Neutrality"
 BRZ_reaffirm_continental_neutrality_desc:0 "Brazil has a long-standing policy of neutrality on the broader world stage. We should continue to enforce this policy."
 BRZ_greater_brazilian_state:0 "A Greater Brazilian State"
 BRZ_greater_brazilian_state_desc:0 "A number of options exist for the future of Brazil, including possible unions with many neighbors..."
 BRZ_negotiate_union_with_la_plata:0 "Negotiate Union with La Plata"
 BRZ_negotiate_union_with_la_plata_desc:0 "A union with our longtime allies in La Plata would cement our influence over the southern part of the continent."
 BRZ_sun_confederation:0 "La Confederación del Sol"
 BRZ_sun_confederation_desc:0 "A union with the rising power of Panama would make us the preiminent power of the hemisphere, building an empire stretching from the Gulf of Mexico to the South Atlantic."
 BRZ_brazil_first:0 "Brazil First"
 BRZ_brazil_first_desc:0 "Brazil does not need a union to be strong!"
 BRZ_second_artigas_war:0 "The Second Artigas War"
 BRZ_second_artigas_war_desc:0 "The rise of Codah to power has set off a rebellion across much of Brazil. Most of the nation, outside the capital regions and the southern towns loyal to Codah, have risen up against the new government."
 BRZ_accept_american_support:0 "Accept American Support"
 BRZ_accept_american_support_desc:0 "Our old rivals in America have offered to give us support against the rebels. If we accept, they can provide manpower and equipment, though it may risk intervention from La Plata."
 BRZ_establish_dictatorship:0 "Establish a Brazilian Dictatorship"
 BRZ_establish_dictatorship_desc:0 "The enemies of Codah have been vanquished. Brazil is a new nation, led by its unquestioned supreme leader."
 BRZ_olivio_forgotten:0 "Olivio, Forgotten"
 BRZ_olivio_forgotten_desc:0 "With the new state in power, the name and legacy of Olivio will slowly fall into the obscure pages of history."
 BRZ_kickstart_the_war:0 "Kickstart the War"
 BRZ_kickstart_the_war_desc:0 "We must destroy the American menace once and for all."

 VNC_claims_on_italy:0 "Claims on Italy"
 VNC_claims_on_italy_desc:0 "Our nation is at an all-time peak in activity. The conquest of Hispania is nearly complete. Now is the time to declare our might and prepare to unite Italy under the rule of the Doge!"
 VNC_secure_spain:0 "Secure Spain"
 VNC_secure_spain_desc:0 "With the Spanish Empire in collapse the Iberian peninsula is ripe for the taking."
 VNC_war_in_anatolia:0 "War in Anatolia"
 VNC_war_in_anatolia_desc:0 "The Turks and Greeks are preparing a counteroffensive to capture our holdings in Anatolia. The eastern reaches of our empire must be protected!"
 VNC_war_with_turkey:0 "Is at war with Turkey"
 VNC_war_for_italy:0 "War for Italy"
 VNC_war_for_italy_desc:0 "The time has come to defeat the Genoese menace and establish our control over Italy."
 VNC_italian_empire:0 "Italian Empire"
 VNC_italian_empire_desc:0 "With the Italian peninsula finally under our total control, it may now be the true base of our growing empire."
 VNC_european_capital:0 "European Capital"
 VNC_european_capital_desc:0 "We must develop the capital city of Venice into the most prosperous town in Europe."
 VNC_purchase_sicily:0 "Purchase Sicily"
 VNC_purchase_sicily:0 "The oppurtunity to purchase Sicily and remove it from Genoa's holdings is an oppurtunity which cannot be missed."
 VNC_la_serenissima:0 "La Serenissima"
 VNC_la_serenissima_desc:0 "Venice is the 'Most Serene' of the Mediterranean. Our focus should be on within, on our people, and our great city-state, rather than needless imperialism."
 VNC_rally_the_merchants:0 "Rally the Merchants"
 VNC_rally_the_merchants_desc:0 "If we wish to reform Venice, we must gain the support of the merchants and farmers of the nation."
 VNC_overthrow_the_doge:0 "Overthrow the Doge"
 VNC_overthrow_the_doge_desc:0 "Popular support for a true democracy is at an all-time high. CorruptedGreed must submit to the demands of the people."
 VNC_med_pact:0 "The Mediterranean Pact"
 VNC_med_pact_desc:0 "Forming an alliance with our Italian brothers in Genoa will protect our trade routes and make Italy safer and more prosperous!"
 VNC_mountain_munition_plants:0 "Mountain Armories"
 VNC_mountain_munition_plants_desc:0 "The construction of new military industries in the Venetian Alps will support our military industrial complex."
 VNC_bologna_investments:0 "Bologna Investments"
 VNC_bologna_investments_desc:0 "The region of Bologna, just south of Venice proper, is ripe for industrial investment."
 VNC_adriatic_shipyards:0 "Adriatic Shipyards"
 VNC_adriatic_shipyards_desc:0 "The coastline of Dalmatia, now a key part of our empire, is a prime location for building new shipyards to grow our naval and merchant fleets."
 VNC_trent_industry:0 "Trent Industry"
 VNC_trent_industry_desc:0 "Trent, which sits in the suburbs of Venice, has open space for new industrial areas."
 VNC_advertise_national_shop:0 "Advertise National Shop"
 VNC_advertise_national_shop_desc:0 "Advertising the national mall will greatly increase revenue for the Serene Republic."
 VNC_nsr_treaty:0 "NSR Treaty"
 VNC_nsr_treaty_desc:0 "A non-aggression pact with the North Sea Republic will open up diplomacy with a major European power."

 NTL_successful_recruiting:0 "Successful Recruiting"
 NTL_successful_recruiting_desc:0 "Our recruiting efforts have been a great success in recent weeks"
 NTL_army_reorganization:0 "Army Reorganization"
 NTL_army_reorganization_desc:0 "Our army has been in bad shape recently due to a lack of experienece. Training exercises and new strategies may help reorganize the armed forces."
 turtle_war:0 "Clearing the Rhine has happened"
 NTL_development_of_voc_hq:0 "Development of VOC HQ"
 NTL_development_of_voc_hq_desc:0 "As our colonial holdings in Indoensia continue to grow, it would be beneficial to construct a headquarters for the Dutch East India Company in Amsterdam."
 NTL_royal_dutch_cavalry:0 "Royal Dutch Cavalry"
 NTL_royal_dutch_cavalry_desc:0 "Investments in a tank corps will allow us to update our army's cavalry to modern-day requirements"
 NTL_fire_supremacy:0 "Fire Supremacy"
 NTL_fire_supremacy_desc:0 "Defending the borders of our nation will require the ability to control the battlefield at range through artillery fire."
 NTL_advertise_national_mall:0 "Advertise National Mall"
 NTL_advertise_national_mall_desc:0 "Advertising the national mall will greatly increase revenue for the Kingdom."
 NTL_leader_of_germans:0 "Leader of Germans"
 NTL_leader_of_germans_desc:0 "Since most German towns joined us last year, the Netherlands is now the leader of the German people, and should take pride in advancing Germania!"
 NTL_artifacts_for_rijksmuseum:0 "Artifacts for Rijksmuseum"
 NTL_artifacts_for_rijksmuseum_desc:0 "The addition of worldly artifacts to the newly-completed Rijksmuseum in Amsterdam will be an incredible sight to see."
 NTL_end_turtle_wars:0 "End the Turtle Wars"
 NTL_end_turtle_wars_desc:0 "The wars over turtles in the Rhine have been raging for nearly a year now. After many months of fighting and internal tensions, most are ready to put this chapter behind us."
 NTL_open_parliament:0 "Open Parliament"
 NTL_open_parliament_desc:0 "By opening the Dutch parliament to all citizens, we hope to improve activity and citizen engagement."
 NTL_college_of_imperial_lords:0 "College of Imperial Lords"
 NTL_college_of_imperial_lords_desc:0 "Following the direction of the Emperor, the first meeting of the new elected legislature, the College of Imperial Lords, shall be held in Amsterdam."
 NTL_join_ofn:0 "Join OFN"
 NTL_join_ofn_desc:0 "The OFN is a powerful alliance of democratic nations across the free world. Joining would grant us access to defense gurantees and diplomatic connections to every corner of the planet."
 NTL_alpine_developments:0 "Alpine Developments"
 NTL_alpine_developments_desc:0 "Our holdings in Switzerland are a excellent place for new investments."

 emc_army_effort:0 "Army Effort"
 emc_equipment_effort:0 "Equipment Effort"
 emc_motorization_effort:0 "Motorization Effort"
 emc_doctrine_effort:0 "Doctrine Effort"
 emc_equipment_effort_ii:0 "Equipment Effort 2"
 emc_mechanization_effort:0 "Mechanization Effort"
 emc_doctrine_effort_ii:0 "Doctrine Effort 2"
 emc_equipment_effort_iii:0 "Equipment Effort 3"
 emc_armor_effort:0 "Armor Effort"
 emc_special_forces:0 "Special Forces"
 emc_aviation_effort:0 "Aviation Effort"
 emc_fighter_focus:0 "Fighter Focus"
 emc_bomber_focus:0 "Bomber Focus"
 emc_aviation_effort_ii:0 "Aviation Effort 2"
 emc_CAS_effort:0 "CAS Effort"
 emc_rocket_effort:0 "Rocket Effort"
 emc_NAV_effort:0 "Naval Bomber Effort"
 emc_naval_effort:0 "Naval Effort"
 emc_flexible_navy:0 "Flexible Navy"
 emc_large_navy:0 "Large Navy"
 emc_submarine_effort:0 "Submarine Effort"
 emc_cruiser_effort:0 "Cruiser Effort"
 emc_destroyer_effort:0 "Destroyer Effort"
 emc_capital_ships_effort:0 "Capital Ships Effort"
 emc_army_effort_desc:0 "Despite the increasing possibilities of aerial and naval warfare, ground combat is still key in tomorrow's wars. With preparation, we can avoid reliving the hell of the trenches."
 emc_equipment_effort_desc:0 "The limits for what equipment can be carried by infantry are constantly being pushed. We will focus on giving our troops the best tools available."
 emc_motorization_effort_desc:0 "Mobility and protection are crucial to get infantry into and out of the field safely. Focusing on these developments will allow us to take action quickly."
 emc_doctrine_effort_desc:0 "The military doctrines that defined ground combat in the Great War are outdated. We must put our greatest minds to the task of shaping the military thought of tomorrow."
 emc_equipment_effort_2_desc:0 "We will continue our efforts to ensure our infantry and support troops are armed with the best possible equipment of our time."
 emc_mechanization_effort_desc:0 "Rethinking the possibilities of motorized infantry, we can push the limits of what vehicles can be constructed today."
 emc_doctrine_effort_2_desc:0 "The battlefield has changed not just in the interbellum years, but over the course of recent conflicts. We must continuously reevaluate our doctrines to reflect this."
 emc_equipment_effort_3_desc:0 "Instead of imitating or buying foreign equipment, we should aim to become world-leading in infantry weapons."
 emc_armor_effort_desc:0 "Applying what we have learned from mechanizing our infantry, we can improve our armored vehicles as well."
 emc_special_forces_desc:0 "We have need of elite forces; mountain troops and paratroopers should be our priority."
 emc_aviation_effort_desc:0 "Nowhere is technological advances more rapid than in aerial warfare. Aviation is a field any modern nation must master."
 emc_fighter_focus_desc:0 "We have not seen that last of dogfights in the Great War. Keeping ahead in the development of fighter planes will give us an edge in the future."
 emc_bomber_focus_desc:0 "When people of the future speak of the horror to today's wars, fire raining from the skies will prominently feature. We will do our best to ensure those stories are told by our enemies."
 emc_aviation_effort_2_desc:0 "Further advances in aviation will be necessary to integrate our air force well with other branches of the military."
 emc_CAS_effort_desc:0 "A modern army needs support from vehicles not only on the ground, but also in the air."
 emc_rocket_effort_desc:0 "Rocket and jet engines allow for unprecedented speeds for unmanned and manned vessels alike. Pioneering these technologies will allow us to take the enemy by surprise."
 emc_NAV_effort_desc:0 "Just as the new naval warfare takes place in part beneath the water's surface, part of it takes place in the air above the waters."
 emc_naval_effort_desc:0 "The expansion of our navy should be our first priority. Assign all available resources to new Dockyards and research into light surface ships."
 emc_flexible_navy_desc:0 "Reinventing naval warfare to account for the advances in submarine technology will allow us to strike efficiently against enemy convoys."
 emc_large_navy_desc:0 "Adapting our naval doctrines to accommodate large ships and ensuring the safety of our trade convoys will teach us much about what sort of ships we need."
 emc_submarine_effort_desc:0 "Submarine warfare is the most exciting naval development since the invention of the torpedo boat. We would do well to not just protect against submarines, but also use them against enemy shipping."
 emc_cruiser_effort_desc:0 "Before making forays into advanced battleship research, the smaller cruisers are in need of replacement."
 emc_destroyer_effort_desc:0 "Studying the design and strategic use of submarines, we have also learned how to counter those strategies. Destroyers will be crucial for this."
 emc_capital_ships_effort_desc:0 "The nation with the most battleships will rule the oceans. Battleships and carriers represent the old and the new in naval superiority."
