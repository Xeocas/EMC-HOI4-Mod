l_english:
 eden_of_democracy:0 "Eden of Democracy"
 eden_of_democracy_desc:0 "Cascadia stands as the Eden of Democracy, and the keeper of the torch of liberty. It is particularly difficult for more authoritarian ideologies to take hold here."
 the_frontier:0 "The Frontier"
 the_frontier_desc:0 "The eastern Frontier region of Cascadia has almost always been at odds, both politically and culturally, with the establishment liberals of the metropolitan. Only time will tell if they can again take the reins of the Cascadian government back under their control."
 jeffcadia:0 "Jeffcadia"
 jeffcadia_desc:0 "In the waning months of 2023, the California nation of Jefferson collapsed, with most of its towns voluntarily choosing to join Cascadia. However, Cascadia's control over California is hardly secure, and steps will need to be taken to secure the crown jewel of the American West."
 ineffective_national_guard:0 "Ineffective National Guard"
 CAS_great_north_icerail_crisis:0 "Great North Icerail Crisis"
 CAS_great_north_icerail_crisis_desc:0 "Mayors in the Great North are displeased with the government's attempts to take control over icerail construction. The crisis may escalate."
 CAS_icerails_in_disrepair:0 "Icerails in Disrepair"
 CAS_icerails_in_disrepair_desc:0 "The icerail system is confusing, limited, and often broken. Investment will be required to fix the nation's transportation system."
 CAS_federated_icerails:0 "Federated Icerails"
 CAS_federated_icerails_desc:0 "Cascadia's icerail system is operated regionally by the various mayors, rather than by a single national entity."
 CAS_rail_union:0 "Cascadian Rail Union"
 CAS_rail_union_desc:0 "Mayors in the Great North have taken matters into their own hands and created a private company to manage their icerails."
 CAS_cascgate:0 "CascGate"
 CAS_cascgate_desc:0 "The CascGate program promises to greatly expand the national transportation system."

 SPN_surrendered_nation:0 "Surrendered Nation"
 SPN_surrendered_nation_desc:0 "The government of the former Spanish Empire has abandoned the nation, leaving it open to overclaim."

 holy_roman_empire:0 "Holy Roman Empire"
 holy_roman_empire_desc:0 "As a member of the Holy Roman Empire, this nation upholds its values and tenants."

